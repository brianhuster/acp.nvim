name: Run tests

on: [push, pull_request]

jobs:
  test_lua_jit:
    name: Test on ${{ matrix.os }} with Neovim ${{ matrix.nvim_version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        nvim_version: [nightly]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v7

    - name: Set up Neovim
      uses: rhysd/action-setup-vim@v1
      with:
        neovim: true
        version: ${{ matrix.nvim_version }}

    - if: runner.os == 'Linux'
      name: Run tests (Linux)
      run: |
        sudo apt update
        sudo apt install -y xclip xvfb libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libdbus-1-3 libxcb-shape0 libxcb-randr0 mesa-utils libegl1 libxcb-cursor0
        xvfb-run -a make test

    - if: runner.os != 'Linux'
      name: Run tests (Non Linux)
      run: make test
